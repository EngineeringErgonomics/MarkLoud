name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Format check
        run: make fmtcheck

      - name: Vet
        run: make vet

      - name: Lint
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2024.1
          staticcheck ./...

      - name: Test
        run: make test
