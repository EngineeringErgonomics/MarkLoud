name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Install linters
        run: |
          curl -sSfL https://raw.githubusercontent.com/dominikh/go-tools/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest

      - name: Format check
        run: make fmtcheck

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Test
        run: make test
